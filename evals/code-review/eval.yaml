name: code-review
description: Evaluates detection quality against hidden, worked pull-request fixtures.
version: "1"
type: capability
defaults:
  runs: 1
  timeout: 12m
  model: gpt-5.3-codex
  reasoning_effort: high
  executor: copilot-sdk
scoring:
  threshold: 1
agent_environment:
  skills: [../../skills/code-review]
stimuli:
  - name: add-refund-event-handler
    tags:
      skill: code-review
      loop: [pr, main, nightly]
      cost: medium
    prompt: >-
      Review change.patch for merge-blocking defects in the proposed refund event
      handler, using the supplied source files as context. The patch is review
      evidence; do not apply it or edit the repository.
    agent_environment:
      files:
        - src: fixtures/detection/dev/add-refund-event-handler/context
          dest: .
        - src: fixtures/detection/dev/add-refund-event-handler/diff.patch
          dest: change.patch
        - src: fixtures/detection/dev/add-refund-event-handler/pr.md
          dest: pr.md
      commands:
        - git init -q
        - git config user.email vally@example.invalid
        - git config user.name Vally
        - git add -A
        - git commit -qm baseline
    grading_environment:
      files:
        - src: fixtures/detection/dev/add-refund-event-handler/expected.json
          dest: .vally/expected.json
    graders:
      - type: finding-match
      - type: skill-invocation
        config:
          required: [code-review]
      - type: diff-empty

  - name: distractor-exec-array-args
