name: Skill evaluations

on:
  pull_request:
    paths:
      - ".github/workflows/skill-eval.yml"
      - ".vally.yaml"
      - "dashboard/**"
      - "evals/**"
      - "scripts/**"
      - "skills/**"
      - "tests/dashboard/**"
      - "tests/skill-eval/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/skill-eval.yml"
      - ".vally.yaml"
      - "dashboard/**"
      - "evals/**"
      - "scripts/**"
      - "skills/**"
  workflow_dispatch:
    inputs:
      skills:
        description: "Comma-separated skill names, or all"
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: skill-eval-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VALLY_TELEMETRY_OPTOUT: "1"
  NODE_VERSION: "22.12.0"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: evals/_vally/package-lock.json
      - name: Install Vally toolchain
        run: npm ci --prefix evals/_vally
      - name: Build and test plugins
        run: |
          npm run typecheck --prefix evals/_vally
          npm run build --prefix evals/_vally
          npm test --prefix evals/_vally
      - name: Lint skills and evals
        shell: pwsh
        run: |
          $vally = "evals/_vally/node_modules/@microsoft/vally-cli/dist/index.js"
          $grader = (Resolve-Path "evals/_vally/dist/graders/finding-match.js").Path.Replace("\", "/")
          node $vally lint skills --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem evals -Filter eval.yaml -Recurse | ForEach-Object {
            node $vally lint --eval-spec $_.FullName --grader-plugin $grader --strict
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run offline regression checks
        shell: pwsh
        run: ./scripts/Invoke-VallyRegression.ps1
      - name: Run dashboard tests
        run: node tests/dashboard/app-tests.mjs
      - name: Run PowerShell tests
        shell: pwsh
        run: Invoke-Pester -Path tests/skill-eval/, tests/dashboard/ -Output Detailed -CI

  detect:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.changed.outputs.skills }}
      has_skills: ${{ steps.changed.outputs.has_skills }}
      dashboard_changed: ${{ steps.changed.outputs.dashboard_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changed
        shell: pwsh
        env:
          REQUESTED_SKILLS: ${{ inputs.skills }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            if ($env:REQUESTED_SKILLS -eq "all") {
              $json = ./scripts/Get-ChangedVallySkills.ps1 -FullSweep
            } else {
              $json = ./scripts/Get-ChangedVallySkills.ps1 -FullSweep -OnlySkills ($env:REQUESTED_SKILLS -split ",")
            }
          } else {
            $json = ./scripts/Get-ChangedVallySkills.ps1 -BaseRef HEAD^ -HeadRef HEAD
          }
          $selected = @($json | ConvertFrom-Json)
          "skills=$json" >> $env:GITHUB_OUTPUT
          "has_skills=$([bool]($selected.Count))".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          $dashboardChanged = $false
          if ($env:GITHUB_EVENT_NAME -eq "push") {
            git rev-parse --verify "HEAD^^{commit}" 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) {
              $dashboardChanged = $true
            } else {
              $dashboardChanged = @(
                git diff --name-only HEAD^ HEAD |
                  Where-Object { $_ -match '^(dashboard/|scripts/sync-dashboard\.ps1$)' }
              ).Count -gt 0
            }
          }
          "dashboard_changed=$dashboardChanged".ToLowerInvariant() >> $env:GITHUB_OUTPUT

  evaluate:
    needs: detect
    if: needs.detect.outputs.has_skills == 'true' || needs.detect.outputs.dashboard_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source
      - name: Check out Pages data
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: source/evals/_vally/package-lock.json
      - name: Install and build Vally toolchain
        if: needs.detect.outputs.has_skills == 'true'
        working-directory: source
        run: |
          npm ci --prefix evals/_vally
          npm run build --prefix evals/_vally
      - name: Authenticate Copilot CLI
        if: needs.detect.outputs.has_skills == 'true'
        working-directory: source
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          test -n "$COPILOT_GITHUB_TOKEN"
          npm install --global @github/copilot
          copilot --version
      - name: Evaluate changed skills
        id: evaluations
        continue-on-error: true
        if: needs.detect.outputs.has_skills == 'true'
        working-directory: source
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
          CHANGED_SKILLS: ${{ needs.detect.outputs.skills }}
          VALLY_PAGES_DIR: ${{ github.workspace }}/pages
          VALLY_REPOSITORY: ${{ github.repository }}
          VALLY_COMMIT: ${{ github.sha }}
          VALLY_RUN_ID: ${{ github.run_id }}
          VALLY_RUN_KIND: main
          VALLY_ARTIFACT_NAME: eval-history-${{ github.run_id }}
        run: |
          $vally = "evals/_vally/node_modules/@microsoft/vally-cli/dist/index.js"
          $grader = (Resolve-Path "evals/_vally/dist/graders/finding-match.js").Path.Replace("\", "/")
          $pages = (Resolve-Path "evals/_vally/dist/reporters/pages-history.js").Path.Replace("\", "/")
          $detection = (Resolve-Path "evals/_vally/dist/reporters/detection.js").Path.Replace("\", "/")
          $failures = @()
          foreach ($skill in ($env:CHANGED_SKILLS | ConvertFrom-Json)) {
            node $vally eval --eval-spec "evals/$skill/eval.yaml" --suite main --runs 1 `
              --output-dir "vally-results/$skill" `
              --grader-plugin $grader `
              --reporter-plugin $pages `
              --reporter-plugin $detection `
              --require-pass
            if ($LASTEXITCODE -ne 0) { $failures += $skill }
          }
          if ($failures.Count -gt 0) {
            throw "Evaluation failed for: $($failures -join ', ')"
          }
      - name: Build Pages manifest
        working-directory: source
        shell: pwsh
        run: ./scripts/Build-VallyDashboardManifest.ps1 -PagesDir ../pages -Repository $env:GITHUB_REPOSITORY
      - name: Sync dashboard files
        working-directory: source
        shell: pwsh
        run: ./scripts/sync-dashboard.ps1 -SourceDir dashboard -PagesDir ../pages
      - name: Upload detailed results
        if: ${{ !cancelled() && needs.detect.outputs.has_skills == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-history-${{ github.run_id }}
          path: source/vally-results
          retention-days: 90
      - name: Publish Pages data
        working-directory: pages
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Vally eval results for ${GITHUB_SHA::7}"
          git pull --rebase
          git push
      - name: Report evaluation failure
        if: ${{ !cancelled() && steps.evaluations.outcome == 'failure' }}
        run: |
          echo "One or more skill evaluations failed. See the artifact upload and Pages publication steps for preservation results."
          exit 1
